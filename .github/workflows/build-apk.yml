name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: install platform + build-tools
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -x "$SDKM" ] || { echo "sdkmanager tidak ada"; exit 1; }
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: fetch xposed api-82.jar
        run: |
          mkdir -p xposed/libs
          for URL in \
            "https://api.xposed.info/api-82.jar" \
            "https://raw.githubusercontent.com/LSPosed/LSPosed/master/magisk-loader/src/main/resources/xposed/api-82.jar" \
            "https://github.com/rovo89/XposedBridge/raw/art/app/build/api-82.jar"
          do
            if curl -fsSL --retry 2 -o xposed/libs/api-82.jar "$URL"; then
              if [ -s xposed/libs/api-82.jar ] && unzip -t xposed/libs/api-82.jar >/dev/null 2>&1; then
                echo "ok: $URL"; break
              fi
            fi
          done
          [ -s xposed/libs/api-82.jar ] || { echo "semua mirror gagal"; exit 1; }
          unzip -l xposed/libs/api-82.jar | grep -q 'de/robv/android/xposed/IXposedHookLoadPackage.class' \
            || { echo "jar bukan api xposed"; exit 1; }

      - name: write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: build debug APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :xposed:assembleDebug --no-daemon --stacktrace

      - name: list produced APKs
        if: always()
        run: find . -name "*.apk" -type f -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
