name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: install platform + build-tools
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          [ -x "$SDKM" ] || { echo "sdkmanager tidak ada"; exit 1; }
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: compile xposed stubs from manual-input
        run: |
          [ -d manual-input/xposed-stubs ] || { echo "manual-input/xposed-stubs tidak ada"; exit 1; }
          SOURCES=$(find manual-input/xposed-stubs -name '*.java' | sort)
          [ -n "$SOURCES" ] || { echo "tidak ada .java"; exit 1; }
          echo "sumber:"
          echo "$SOURCES"
          mkdir -p /tmp/stub-classes xposed/libs
          javac -source 17 -target 17 -d /tmp/stub-classes $SOURCES
          cd /tmp/stub-classes
          jar cf "$GITHUB_WORKSPACE/xposed/libs/xposed-stubs.jar" .
          cd "$GITHUB_WORKSPACE"
          unzip -l xposed/libs/xposed-stubs.jar | grep -q 'de/robv/android/xposed/IXposedHookLoadPackage.class' \
            || { echo "jar stubs tidak valid"; exit 1; }
          ls -lh xposed/libs/xposed-stubs.jar

      - name: install google-services.json
        run: |
          [ -s manual-input/google-services.json ] || { echo "google-services.json kosong"; exit 1; }
          cp manual-input/google-services.json app/google-services.json
          grep -q '"package_name"' app/google-services.json || { echo "format salah"; exit 1; }

      - name: fetch gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar"
          [ -s gradle/wrapper/gradle-wrapper.jar ] || { echo "wrapper jar kosong"; exit 1; }
          ls -lh gradle/wrapper/gradle-wrapper.jar

      - name: write gradlew
        run: |
          cat > gradlew <<'GRADLEW'
          #!/usr/bin/env sh
          APP_HOME=$(cd "$(dirname "$0")" && pwd)
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          if [ -n "${JAVA_HOME:-}" ]; then JAVACMD="$JAVA_HOME/bin/java"; else JAVACMD=java; fi
          exec "$JAVACMD" -Dorg.gradle.appname=gradlew -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Bagian yang gw ubah: Build dipisah biar gampang dilacak
      - name: build xposed module
        run: ./gradlew :xposed:assembleDebug --no-daemon --stacktrace

      - name: build app client
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: list produced APKs
        if: always()
        run: find . -name "*.apk" -type f -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: warn